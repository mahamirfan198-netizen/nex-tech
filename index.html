<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXORA TECH — 3D Premium E-Commerce</title>

    <!-- Three.js for 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c12;
            color: #eef2f6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0c12;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #3b6eff, #7a4cff);
            border-radius: 10px;
        }

        /* ===== VIDEO BACKGROUND ===== */
        #video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
            opacity: 0.3;
        }
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at center, rgba(10, 12, 18, 0.7), rgba(10, 12, 18, 0.9));
        }

        /* ===== 3D CANVAS ===== */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .content-overlay {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        /* ===== GLASS NAV ===== */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1280px;
            padding: 16px 32px;
            background: rgba(10, 12, 18, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 110, 255, 0.2);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            transition: 0.3s ease;
        }
        nav.scrolled {
            top: 0;
            border-radius: 0 0 30px 30px;
            width: 100%;
            max-width: 100%;
            background: rgba(10, 12, 18, 0.92);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6a9aff, #b47cff, #6a9aff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
            letter-spacing: -0.5px;
            cursor: pointer;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .logo small {
            font-weight: 400;
            font-size: 0.7rem;
            -webkit-text-fill-color: #8a9bb8;
            background: none;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #b0caf5;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b6eff, #7a4cff);
            transition: 0.3s;
        }
        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }
        .nav-links a:hover {
            color: #eef2f6;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-actions .btn {
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            background: transparent;
            color: #eef2f6;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b6eff, #7a4cff) !important;
            color: #fff !important;
            box-shadow: 0 4px 20px rgba(59, 110, 255, 0.3);
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(59, 110, 255, 0.5);
        }
        .btn-outline {
            border: 1.5px solid rgba(59, 110, 255, 0.3) !important;
        }
        .btn-outline:hover {
            border-color: #3b6eff !important;
            background: rgba(59, 110, 255, 0.1);
        }
        .btn-danger {
            background: #b33a4a !important;
            color: #fff !important;
        }
        .btn-danger:hover {
            background: #d14a5a !important;
        }
        .btn-success {
            background: #2a8f6a !important;
            color: #fff !important;
        }
        .btn-success:hover {
            background: #34a87a !important;
        }

        .cart-icon {
            position: relative;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .cart-icon:hover {
            transform: scale(1.1);
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: linear-gradient(135deg, #3b6eff, #7a4cff);
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 2px 10px rgba(59, 110, 255, 0.4);
        }

        /* ===== HERO ===== */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 60px;
            position: relative;
        }
        .hero-content {
            max-width: 800px;
            animation: fadeUp 1.5s ease-out;
        }
        .hero-content h1 {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #eef2f6 30%, #8ab4f8 80%, #b47cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(59, 110, 255, 0.2);
        }
        .hero-content p {
            font-size: 1.3rem;
            color: #b0caf5;
            margin-bottom: 32px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .hero-badges {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }
        .hero-badges span {
            background: rgba(59, 110, 255, 0.12);
            border: 1px solid rgba(59, 110, 255, 0.2);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #8ab4f8;
            backdrop-filter: blur(8px);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== SECTIONS ===== */
        section {
            padding: 80px 24px;
            position: relative;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #eef2f6, #8ab4f8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .section-title span {
            background: none;
            -webkit-text-fill-color: #8ab4f8;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* ===== GLASS CARDS ===== */
        .glass-card {
            background: rgba(16, 20, 30, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 110, 255, 0.12);
            border-radius: 24px;
            padding: 24px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(59, 110, 255, 0.05), transparent 70%);
            pointer-events: none;
        }
        .glass-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(59, 110, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 110, 255, 0.05);
        }
        .glass-card img {
            width: 100%;
            border-radius: 16px;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #0f131a;
            transition: 0.4s;
        }
        .glass-card:hover img {
            transform: scale(1.02);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }

        .product-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: #8ab4f8;
        }
        .product-old-price {
            font-size: 0.9rem;
            color: #6a7a90;
            text-decoration: line-through;
            margin-left: 8px;
        }
        .product-rating {
            color: #f4b942;
            font-weight: 600;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(59, 110, 255, 0.15);
            color: #8ab4f8;
        }
        .badge-sale {
            background: linear-gradient(135deg, #b33a4a, #d14a5a);
            color: #fff;
        }
        .badge-stock {
            background: rgba(42, 143, 106, 0.2);
            color: #4cd9a0;
        }
        .badge-out {
            background: rgba(179, 58, 74, 0.2);
            color: #d14a5a;
        }
        .badge-bestseller {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
        }
        .badge-new {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
        }

        /* ===== FORMS ===== */
        .form-glass {
            background: rgba(16, 20, 30, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 110, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            max-width: 480px;
            margin: 0 auto;
        }
        .form-glass input,
        .form-glass select,
        .form-glass textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(59, 110, 255, 0.15);
            background: rgba(10, 12, 18, 0.6);
            color: #eef2f6;
            font-size: 1rem;
            transition: 0.3s;
        }
        .form-glass input:focus,
        .form-glass select:focus,
        .form-glass textarea:focus {
            outline: none;
            border-color: #3b6eff;
            box-shadow: 0 0 0 3px rgba(59, 110, 255, 0.15);
        }
        .form-glass label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #b0caf5;
            display: block;
            margin-bottom: 6px;
        }
        .form-group {
            margin-bottom: 18px;
        }

        /* ===== CHATBOT ===== */
        .chatbot-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
        }
        .chatbot-toggle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b6eff, #7a4cff);
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 8px 40px rgba(59, 110, 255, 0.4);
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .chatbot-toggle:hover {
            transform: scale(1.1) rotate(-10deg);
        }

        .chatbot-window {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 380px;
            max-height: 500px;
            background: rgba(16, 20, 30, 0.92);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(59, 110, 255, 0.15);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 9999;
        }
        .chatbot-window.open {
            display: flex;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .chatbot-header {
            padding: 16px 20px;
            background: rgba(59, 110, 255, 0.1);
            border-bottom: 1px solid rgba(59, 110, 255, 0.1);
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chatbot-header .status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4cd9a0;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }
        .chatbot-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            max-height: 320px;
            min-height: 200px;
        }
        .chatbot-messages .msg {
            margin-bottom: 10px;
            padding: 10px 16px;
            border-radius: 16px;
            max-width: 88%;
            animation: fadeUp 0.3s ease;
        }
        .chatbot-messages .user {
            background: linear-gradient(135deg, #3b6eff, #7a4cff);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chatbot-messages .bot {
            background: rgba(59, 110, 255, 0.08);
            border: 1px solid rgba(59, 110, 255, 0.1);
            border-bottom-left-radius: 4px;
        }
        .chatbot-input {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid rgba(59, 110, 255, 0.1);
        }
        .chatbot-input input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(59, 110, 255, 0.15);
            background: rgba(10, 12, 18, 0.6);
            color: #eef2f6;
        }
        .chatbot-input button {
            background: linear-gradient(135deg, #3b6eff, #7a4cff);
            border: none;
            color: #fff;
            border-radius: 40px;
            padding: 0 24px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .chatbot-input button:hover {
            transform: scale(1.05);
        }

        /* ===== ADMIN ===== */
        .admin-panel {
            background: rgba(16, 20, 30, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 110, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .admin-stat {
            background: rgba(10, 12, 18, 0.6);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(59, 110, 255, 0.08);
            text-align: center;
        }
        .admin-stat .number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8ab4f8, #b47cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .admin-stat .label {
            font-size: 0.85rem;
            color: #8a9bb8;
            margin-top: 4px;
        }

        /* ===== TOAST ===== */
        .toast-notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 20, 30, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 110, 255, 0.2);
            border-radius: 16px;
            padding: 16px 32px;
            color: #eef2f6;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: fadeUp 0.4s ease;
            max-width: 90%;
            text-align: center;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(59, 110, 255, 0.1);
            border-top: 3px solid #3b6eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 992px) {
            nav {
                padding: 12px 20px;
                border-radius: 30px;
                width: 96%;
                top: 10px;
            }
            .nav-links {
                gap: 14px;
            }
            .hero-content h1 {
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 10px;
                border-radius: 20px;
                padding: 12px 16px;
                top: 8px;
                width: 95%;
            }
            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                gap: 10px;
            }
            .nav-links a {
                font-size: 0.8rem;
                padding: 4px 8px;
            }
            .nav-actions {
                width: 100%;
                justify-content: center;
                gap: 8px;
            }
            .nav-actions .btn {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
            .logo {
                font-size: 1.4rem;
            }
            .hero-content h1 {
                font-size: 2.2rem;
            }
            .hero-content p {
                font-size: 1rem;
            }
            .hero-badges span {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .section-title {
                font-size: 2rem;
            }
            .grid-3 {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
            }
            .grid-4 {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 16px;
            }
            .chatbot-window {
                width: 300px;
                right: 16px;
                bottom: 90px;
            }
            .form-glass {
                padding: 20px;
                margin: 0 12px;
            }
            section {
                padding: 60px 16px;
            }
            .admin-stats {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 10px;
            }
            .admin-stat .number {
                font-size: 1.5rem;
            }
            .cart-icon {
                font-size: 1.2rem;
            }
            .cart-count {
                width: 18px;
                height: 18px;
                font-size: 0.6rem;
                top: -6px;
                right: -10px;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 10px 12px;
                border-radius: 16px;
                top: 6px;
                width: 98%;
            }
            .nav-links a {
                font-size: 0.7rem;
                padding: 3px 6px;
            }
            .nav-actions .btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            .logo {
                font-size: 1.2rem;
            }
            .logo small {
                font-size: 0.6rem;
            }
            .hero-content h1 {
                font-size: 1.8rem;
            }
            .hero-content p {
                font-size: 0.9rem;
            }
            .hero-badges span {
                font-size: 0.6rem;
                padding: 3px 10px;
            }
            .section-title {
                font-size: 1.6rem;
            }
            .grid-3 {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .grid-4 {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .glass-card {
                padding: 16px;
            }
            .product-price {
                font-size: 1.2rem;
            }
            .chatbot-window {
                width: 280px;
                right: 10px;
                bottom: 80px;
                max-height: 400px;
            }
            .chatbot-toggle {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            .admin-panel {
                padding: 16px;
            }
            .admin-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== TABLET ===== */
        @media (min-width: 769px) and (max-width: 1024px) {
            nav {
                padding: 14px 24px;
            }
            .hero-content h1 {
                font-size: 3.5rem;
            }
            .grid-3 {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== VIDEO BACKGROUND ===== -->
    <video id="video-bg" autoplay muted loop playsinline>
        <source src="https://cdn.pixabay.com/video/2023/01/07/145969-792620201_tiny.mp4" type="video/mp4" />

            // ==========================================================

            let currentUser = null;

                let cart = DB.carts.find(c => c.user_id === userId);
                if (!cart) {
                    cart = { id: DB._nextId++, user_id: userId, created_at: new Date().toISOString() };

                return cart;

            function getCartItems(cartId) {
                return DB.cart_items.filter(ci => ci.cart_id === cartId);
            }

            function getProductWithDetails(productId) {
                const p = findProduct(productId);
                if (!p) return null;
                const images = DB.product_images.filter(img => img.product_id === p.id);
                const specs = DB.product_specs.filter(s => s.product_id === p.id);
                const category = DB.categories.find(c => c.id === p.category_id);
                return { ...p, images, specs, category: category ? category.name : 'General' };
            }

            function getCartTotal(userId) {
                const cart = getCart(userId);
                const items = getCartItems(cart.id);
                let total = 0;
                for (const item of items) {
                    const p = findProduct(item.product_id);
                    if (p) total += (p.price - (p.discount || 0)) * item.quantity;
                }
                return total;
            }

            function verifyPassword(plain, hashed) {
                return hashed === hash(plain);
            }

            function isAdmin() {
                return currentUser && currentUser.role === 'admin';
            }

            // ==========================================================
            //  4. API HANDLER
            // ==========================================================

            function apiCall(route, method, body) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        try {
                            const result = handleApi(route, method, body);
                            resolve(result);
                        } catch (e) {
                            reject(e);
                        }
                    }, 80);
                });
            }

            function handleApi(route, method, body) {
                const [resource, id] = route.split('/').filter(Boolean);

                if (resource === 'auth') {
                    if (method === 'POST' && id === 'login') {
                        const { email, password } = body;
                        const user = findUser(email);
                        if (!user) return { error: 'User not found' };
                        if (!verifyPassword(password, user.password)) return { error: 'Invalid password' };
                        currentUser = { ...user };
                        return { success: true, user: currentUser };
                    }
                    if (method === 'POST' && id === 'register') {
                        const { email, password, name } = body;
                        if (findUser(email)) return { error: 'Email already registered' };
                        const user = {
                            id: DB._nextId++,
                            email,
                            password: hash(password),
                            role: 'customer',
                            name: name || email.split('@')[0],
                            created_at: new Date().toISOString()
                        };
                        DB.users.push(user);
                        return { success: true, user };
                    }
                    if (method === 'POST' && id === 'logout') {
                        currentUser = null;
                        return { success: true };
                    }
                    if (method === 'GET' && id === 'me') {
                        return { user: currentUser };
                    }
                }

                if (resource === 'products') {
                    if (method === 'GET') {
                        if (id) {
                            const p = getProductWithDetails(parseInt(id));
                            return p || { error: 'Product not found' };
                        }
                        let list = DB.products.map(p => getProductWithDetails(p.id));
                        if (body?.category) list = list.filter(p => p.category_id === parseInt(body.category));
                        if (body?.search) {
                            const s = body.search.toLowerCase();
                            list = list.filter(p => p.name.toLowerCase().includes(s) || p.description.toLowerCase()
                            .includes(s));
                        }
                        if (body?.sort) {
                            if (body.sort === 'price-asc') list.sort((a, b) => a.price - b.price);
                            else if (body.sort === 'price-desc') list.sort((a, b) => b.price - a.price);
                            else if (body.sort === 'rating') list.sort((a, b) => b.rating - a.rating);
                            else if (body.sort === 'bestseller') list.sort((a, b) => (b.bestseller ? 1 : 0) - (a
                            .bestseller ? 1 : 0));
                        }
                        const page = parseInt(body?.page) || 1;
                        const limit = parseInt(body?.limit) || 9;
                        const start = (page - 1) * limit;
                        const paginated = list.slice(start, start + limit);
                        return { products: paginated, total: list.length, page, limit };
                    }
                    if (method === 'POST') {
                        if (!isAdmin()) return { error: 'Unauthorized' };
                        const p = body;
                        p.id = DB._nextId++;
                        p.created_at = new Date().toISOString();
                        DB.products.push(p);
                        return p;
                    }
                    if (method === 'PUT' && id) {
                        if (!isAdmin()) return { error: 'Unauthorized' };
                        const idx = DB.products.findIndex(p => p.id === parseInt(id));
                        if (idx === -1) return { error: 'Product not found' };
                        DB.products[idx] = { ...DB.products[idx], ...body };
                        return DB.products[idx];
                    }
                    if (method === 'DELETE' && id) {
                        if (!isAdmin()) return { error: 'Unauthorized' };
                        const idx = DB.products.findIndex(p => p.id === parseInt(id));
                        if (idx === -1) return { error: 'Product not found' };
                        DB.products.splice(idx, 1);
                        return { success: true };
                    }
                }

                if (resource === 'cart') {
                    if (!currentUser) return { error: 'Unauthorized' };
                    const cart = getCart(currentUser.id);
                    if (method === 'GET') {
                        const items = getCartItems(cart.id).map(item => {
                            const p = findProduct(item.product_id);
                            return { ...item, product: p };
                        });
                        const total = getCartTotal(currentUser.id);
                        return { items, total, count: items.reduce((s, i) => s + i.quantity, 0) };
                    }
                    if (method === 'POST') {
                        const { product_id, quantity = 1 } = body;
                        const p = findProduct(parseInt(product_id));
                        if (!p) return { error: 'Product not found' };
                        let existing = DB.cart_items.find(ci => ci.cart_id === cart.id && ci.product_id === p.id);
                        if (existing) {
                            existing.quantity += quantity;
                        } else {
                            DB.cart_items.push({
                                id: DB._nextId++,
                                cart_id: cart.id,
                                product_id: p.id,
                                quantity,
                                added_at: new Date().toISOString()
                            });
                        }
                        return { success: true };
                    }
                    if (method === 'PUT' && id) {
                        const item = DB.cart_items.find(ci => ci.id === parseInt(id) && ci.cart_id === cart.id);
                        if (!item) return { error: 'Item not found' };
                        item.quantity = body.quantity || 1;
                        return { success: true };
                    }
                    if (method === 'DELETE' && id) {
                        const idx = DB.cart_items.findIndex(ci => ci.id === parseInt(id) && ci.cart_id === cart.id);
                        if (idx === -1) return { error: 'Item not found' };
                        DB.cart_items.splice(idx, 1);
                        return { success: true };
                    }
                }

                if (resource === 'orders') {
                    if (!currentUser) return { error: 'Unauthorized' };
                    if (method === 'GET') {
                        let orders = DB.orders.filter(o => o.user_id === currentUser.id);
                        if (isAdmin()) orders = DB.orders;
                        return orders.map(o => {
                            const items = DB.order_items.filter(oi => oi.order_id === o.id);
                            return { ...o, items };
                        });
                    }
                    if (method === 'POST') {
                        const cart = getCart(currentUser.id);
                        const items = getCartItems(cart.id);
                        if (items.length === 0) return { error: 'Cart is empty' };
                        for (const item of items) {
                            const p = findProduct(item.product_id);
                            if (!p || p.stock < item.quantity) return { error: `Insufficient stock for ${p?.name || 'product'}` };
                        }
                        const order = {
                            id: DB._nextOrderId++,
                            user_id: currentUser.id,
                            status: 'pending',
                            total: getCartTotal(currentUser.id),
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString()
                        };
                        DB.orders.push(order);
                        for (const item of items) {
                            DB.order_items.push({
                                id: DB._nextId++,
                                order_id: order.id,
                                product_id: item.product_id,
                                quantity: item.quantity,
                                price: findProduct(item.product_id).price
                            });
                            const p = findProduct(item.product_id);
                            p.stock -= item.quantity;
                            DB.inventory_logs.push({
                                id: DB._nextId++,
                                product_id: p.id,
                                change: -item.quantity,
                                reason: 'Order #' + order.id,
                                created_at: new Date().toISOString()
                            });
                        }
                        DB.cart_items = DB.cart_items.filter(ci => ci.cart_id !== cart.id);
                        return { success: true, order };
                    }
                    if (method === 'PUT' && id) {
                        if (!isAdmin()) return { error: 'Unauthorized' };
                        const order = DB.orders.find(o => o.id === parseInt(id));
                        if (!order) return { error: 'Order not found' };
                        order.status = body.status || order.status;
                        order.updated_at = new Date().toISOString();
                        return order;
                    }
                }

                if (resource === 'admin') {
                    if (!isAdmin()) return { error: 'Unauthorized' };
                    if (method === 'GET') {
                        const totalOrders = DB.orders.length;

                        return {

                            users: DB.users,

                            contactMessages: DB.contact_messages,
                            inventoryLogs: DB.inventory_logs
                        };
                    }
                    if (method === 'POST' && id === 'restore') {
                        const { product_id, quantity } = body;
                        const p = findProduct(parseInt(product_id));
                        if (!p) return { error: 'Product not found' };
                        p.stock += parseInt(quantity) || 1;
                        DB.inventory_logs.push({
                            id: DB._nextId++,
                            product_id: p.id,
                            change: parseInt(quantity) || 1,
                            reason: 'Admin restore',
                            created_at: new Date().toISOString()

                        return { success: true, stock: p.stock };
                    }
                }

                if (resource === 'contact') {
                    if (method === 'POST') {
                        const msg = { id: DB._nextId++, ...body, created_at: new Date().toISOString() };
                        DB.contact_messages.push(msg);
                        return { success: true };
                    }
                }

                if (resource === 'chatbot') {
                    if (method === 'POST') {
                        const { message } = body;
                        const lower = message.toLowerCase();
                        let reply = "I'd be happy to help! Could you tell me more about what you're looking for?";
                        const faqs = {

                        return { reply };

                        if (idx === -1) return { error: 'Not found' };

            function renderShop(params) {
                const search = params?.search || '';
                const category = params?.category || '';
                const sort = params?.sort || '';
                let list = DB.products.map(p => getProductWithDetails(p.id));
                if (search) list = list.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.description
                    .toLowerCase().includes(search.toLowerCase()));
                if (category) list = list.filter(p => p.category_id === parseInt(category));
                if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
                else if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
                else if (sort === 'rating') list.sort((a, b) => b.rating - a.rating);
                else if (sort === 'bestseller') list.sort((a, b) => (b.bestseller ? 1 : 0) - (a.bestseller ? 1 : 0));

                const page = parseInt(params?.page) || 1;
                const limit = 12;
                const total = list.length;
                const pages = Math.ceil(total / limit);
                const start = (page - 1) * limit;
                const paginated = list.slice(start, start + limit);

                const catOptions = DB.categories.map(c =>
                    `<option value="${c.id}" ${c.id==parseInt(category)?'selected':''}>${c.icon} ${c.name}</option>`).join(
                    '');

                return `
              <section style="padding-top:120px;">
                <div class="container">
                  <h2 class="section-title">🛒 Shop All <span>Products</span></h2>
                  <div style="display:flex; flex-wrap:wrap; gap:16px; margin-bottom:32px; align-items:center;">
                    <div style="flex:1; min-width:180px;">
                      <input type="text" id="shopSearch" placeholder="🔍 Search products..." value="${search}" style="width:100%; padding:12px 18px; border-radius:40px; border:1px solid rgba(59,110,255,0.15); background:rgba(10,12,18,0.6); color:#eef2f6;" />
                    </div>
                    <select id="shopCategory" style="padding:12px 18px; border-radius:40px; border:1px solid rgba(59,110,255,0.15); background:rgba(10,12,18,0.6); color:#eef2f6;">
                      <option value="">All Categories</option>
                      ${catOptions}
                    </select>
                    <select id="shopSort" style="padding:12px 18px; border-radius:40px; border:1px solid rgba(59,110,255,0.15); background:rgba(10,12,18,0.6); color:#eef2f6;">
                      <option value="">Sort By</option>
                      <option value="price-asc" ${sort==='price-asc'?'selected':''}>Price: Low → High</option>
                      <option value="price-desc" ${sort==='price-desc'?'selected':''}>Price: High → Low</option>
                      <option value="rating" ${sort==='rating'?'selected':''}>Top Rated</option>
                      <option value="bestseller" ${sort==='bestseller'?'selected':''}>Bestsellers</option>
                    </select>
                    <button class="btn btn-primary" id="shopFilterBtn">Apply Filters</button>
                    <span class="text-muted" style="font-size:0.9rem;">${total} products</span>
                  </div>
                  <div class="grid-3">
                    ${paginated.map(p => productCard(p)).join('')}
                  </div>
                  ${pages > 1 ? `
                    <div style="display:flex; justify-content:center; gap:8px; margin-top:32px; flex-wrap:wrap;">
                      ${Array.from({length: pages}, (_, i) => i+1).map(p => `
                        <a data-page="shop" data-params='{"page":${p},"search":"${search}","category":"${category}","sort":"${sort}"}' class="btn ${p===page?'btn-primary':'btn-outline'}" style="padding:8px 18px; min-width:40px;">${p}</a>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              </section>
            `;
            }

            function renderCart() {

                let total = 0;
                const rows = items.map(item => {
                    const p = findProduct(item.product_id);
                    if (!p) return '';
                    const price = p.price - (p.discount || 0);
                    const subtotal = price * item.quantity;
                    total += subtotal;
                    return `
                <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:12px;">
                  <div style="display:flex; gap:16px; align-items:center;">

                      <br />
                      <span class="text-muted">$${price.toFixed(2)}</span>

                  </div>
                  <div style="display:flex; gap:12px; align-items:center;">
                    <button class="btn btn-outline" style="padding:4px 14px;" onclick="updateCartItem(${item.id}, ${item.quantity-1})">−</button>

                  </div>
                  <span style="font-weight:700; color:#8ab4f8;">$${subtotal.toFixed(2)}</span>
                </div>
              `;
                }).join('');

                return `

            // ---- 3D Product Viewer ----
            function initProductViewer() {
                const container = document.getElementById('product3dViewer');
                if (!container) return;

                while (container.firstChild) container.removeChild(container.firstChild);

                const productId = parseInt(container.dataset.productId);
                const p = findProduct(productId);
                if (!p) return;

                const scene3d = new THREE.Scene();
                scene3d.background = new THREE.Color(0x0a0c12);

                const camera3d = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
                camera3d.position.set(2, 1.5, 4);
                camera3d.lookAt(0, 0, 0);

                const renderer3d = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer3d.setSize(container.clientWidth, container.clientHeight);
                renderer3d.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer3d.domElement);

                const amb3d = new THREE.AmbientLight(0x334466, 0.5);
                scene3d.add(amb3d);
                const dir3d = new THREE.DirectionalLight(0x6a9aff, 1.5);
                dir3d.position.set(3, 5, 3);
                scene3d.add(dir3d);
                const rim3d = new THREE.DirectionalLight(0x7a4cff, 0.5);
                rim3d.position.set(-3, 0, 4);
                scene3d.add(rim3d);

                const group = new THREE.Group();
                const color = new THREE.Color().setHSL(0.6 + (p.id % 5) * 0.05, 0.7, 0.5);
                const mat = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.7,
                    roughness: 0.15,
                    emissive: color,
                    emissiveIntensity: 0.05,
                });

                const shapes = [
                    () => {
                        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 24), mat);
                        group.add(sphere);
                        for (let i = 0; i < 3; i++) {
                            const ring = new THREE.Mesh(
                                new THREE.TorusGeometry(0.8 + i * 0.1, 0.02, 8, 32),
                                new THREE.MeshStandardMaterial({ color: 0x3b6eff, emissive: 0x3b6eff,
                                    emissiveIntensity: 0.2 })
                            );
                            ring.rotation.x = Math.PI / 3 + i * 0.3;
                            ring.rotation.y = i * 0.5;
                            group.add(ring);
                        }
                    },
                    () => {
                        const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.6), mat);
                        group.add(base);
                        for (let i = 0; i < 6; i++) {
                            const key = new THREE.Mesh(
                                new THREE.BoxGeometry(0.08, 0.04, 0.08),
                                new THREE.MeshStandardMaterial({ color: 0x7a4cff, emissive: 0x7a4cff,
                                    emissiveIntensity: 0.1 })
                            );
                            key.position.set(-0.4 + i * 0.16, 0.06, -0.2);
                            group.add(key);
                            const key2 = new THREE.Mesh(
                                new THREE.BoxGeometry(0.08, 0.04, 0.08),
                                new THREE.MeshStandardMaterial({ color: 0x7a4cff, emissive: 0x7a4cff,
                                    emissiveIntensity: 0.1 })
                            );
                            key2.position.set(-0.4 + i * 0.16, 0.06, 0.2);
                            group.add(key2);
                        }
                    },
                    () => {
                        const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 24), mat);
                        body.scale.set(1, 0.6, 1.2);
                        group.add(body);
                        const scroll = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.2, 8),
                            new THREE.MeshStandardMaterial({ color: 0x4cd9a0, emissive: 0x4cd9a0,
                                emissiveIntensity: 0.1 })
                        );
                        scroll.rotation.x = Math.PI / 2;
                        scroll.position.set(0, 0.2, 0.15);
                        group.add(scroll);
                    },
                    () => {
                        const face = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.06, 24), mat);
                        face.rotation.x = Math.PI / 2;
                        group.add(face);
                        const band1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.5, 0.3),
                            new THREE.MeshStandardMaterial({ color: 0x3b6eff }));
                        band1.position.set(0, -0.35, 0);
                        group.add(band1);
                        const band2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.5, 0.3),
                            new THREE.MeshStandardMaterial({ color: 0x3b6eff }));
                        band2.position.set(0, 0.35, 0);
                        group.add(band2);
                        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8),
                            new THREE.MeshStandardMaterial({ color: 0x4cd9a0, emissive: 0x4cd9a0,
                                emissiveIntensity: 0.3 }));
                        dot.position.set(0, 0, 0.3);
                        group.add(dot);
                    },
                    () => {
                        const ssd = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.06, 0.5), mat);
                        group.add(ssd);
                        const label = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.01, 0.3),
                            new THREE.MeshStandardMaterial({ color: 0x4cd9a0, emissive: 0x4cd9a0,
                                emissiveIntensity: 0.1 }));
                        label.position.z = 0.27;
                        group.add(label);
                        const connector = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 0.1),
                            new THREE.MeshStandardMaterial({ color: 0xf4b942 }));
                        connector.position.set(0.45, 0, 0);
                        group.add(connector);
                    },
                    () => {
                        const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.5, 1), mat);
                        group.add(core);
                        for (let i = 0; i < 8; i++) {
                            const spike = new THREE.Mesh(
                                new THREE.ConeGeometry(0.04, 0.2, 4),
                                new THREE.MeshStandardMaterial({ color: 0x3b6eff, emissive: 0x3b6eff,
                                    emissiveIntensity: 0.1 })
                            );
                            const angle = (i / 8) * Math.PI * 2;
                            spike.position.set(Math.cos(angle) * 0.5, Math.sin(angle) * 0.3 + 0.2, 0);
                            spike.rotation.z = angle;
                            group.add(spike);
                        }
                    }
                ];

                shapes[(p.category_id - 1) % shapes.length]();
                group.scale.setScalar(1.2);
                scene3d.add(group);

                let rotTime = 0;
                const animate3d = () => {
                    requestAnimationFrame(animate3d);
                    rotTime += 0.02;
                    group.rotation.y += 0.01;
                    group.rotation.x = Math.sin(rotTime * 0.2) * 0.05;
                    group.position.y = Math.sin(rotTime * 0.5) * 0.05;
                    renderer3d.render(scene3d, camera3d);
                };
                animate3d();

                const resizeObserver = new ResizeObserver(() => {
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    camera3d.aspect = w / h;
                    camera3d.updateProjectionMatrix();
                    renderer3d.setSize(w, h);
                });
                resizeObserver.observe(container);

                container._cleanup = () => {
                    resizeObserver.disconnect();
                    renderer3d.dispose();
                };
            }

            // ==========================================================
            //  6. GLOBAL ACTIONS
            // ==========================================================

            window.navigate = function(page, params) {
                if (page === 'admin' && !isAdmin()) {
                    showToast('⛔ Admin access required.');
                    return;
                }
                render(page, params);
                window.history.pushState({ page, params }, '', '#' + page + (params ? '?' + new URLSearchParams(params)
                    .toString() : ''));
                // Close mobile menu
                document.querySelector('.nav-links')?.classList.remove('open');
            };

            window.addToCart = async function(productId) {
                if (!currentUser) { showToast('Please login first.'); return; }

                if (res.success) {
                    updateCartBadge();
                    showToast('✅ Added to cart!');
                } else {
                    showToast('❌ ' + (res.error || 'Error adding to cart'));
                }
            };

            window.updateCartItem = async function(itemId, qty) {
                if (qty <= 0) { removeCartItem(itemId); return; }
                await apiCall('cart/' + itemId, 'PUT', { quantity: qty });
                render('cart');
            };

            window.removeCartItem = async function(itemId) {
                await apiCall('cart/' + itemId, 'DELETE');
                render('cart');
            };

            window.toggleWishlist = async function(productId) {
                if (!currentUser) { showToast('Login first'); return; }
                const existing = DB.wishlists.find(w => w.user_id === currentUser.id && w.product_id === productId);
                if (existing) {
                    await apiCall('wishlist/' + existing.id, 'DELETE');
                    showToast('💔 Removed from wishlist');
                } else {
                    await apiCall('wishlist', 'POST', { product_id: productId });
                    showToast('❤️ Added to wishlist');
                }
                render('product', { id: productId });
            };

            window.placeOrder = async function() {
                if (!currentUser) { showToast('Login first'); return; }
                const address = document.getElementById('checkoutAddress')?.value;
                if (!address) { showToast('Please enter a shipping address.'); return; }
                const res = await apiCall('orders', 'POST');
                if (res.success) {
                    showToast('🎉 Order placed successfully!');
                    render('orders');
                } else {
                    showToast('❌ ' + (res.error || 'Order failed'));
                }
            };

            window.handleLogin = async function() {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                if (!email || !password) { showToast('Please fill all fields.'); return; }
                const res = await apiCall('auth/login', 'POST', { email, password });
                if (res.success) {
                    currentUser = res.user;
                    updateNav();
                    showToast('👋 Welcome back, ' + currentUser.name + '!');
                    if (currentUser.role === 'admin') {
                        render('admin');
                    } else {
                        render('home');
                    }
                } else {
                    showToast('❌ ' + (res.error || 'Login failed'));
                }
            };

            window.handleRegister = async function() {
                const name = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value.trim();
                if (!name || !email || password.length < 6) {
                    showToast('Please fill all fields and use at least 6 characters for password.');
                    return;
                }
                const res = await apiCall('auth/register', 'POST', { email, password, name });
                if (res.success) {
                    showToast('✅ Registration successful! Please login.');
                    render('login');
                } else {
                    showToast('❌ ' + (res.error || 'Registration failed'));
                }
            };

            window.submitReview = async function(productId) {
                if (!currentUser) { showToast('Login first'); return; }
                const rating = parseInt(document.getElementById('reviewRating').value);
                const comment = document.getElementById('reviewComment').value.trim();
                if (!rating) { showToast('Please select a rating.'); return; }
                const res = await apiCall('reviews', 'POST', {
                    product_id: productId,
                    rating,
                    comment,
                    user_name: currentUser.name
                });
                if (res.success) {
                    showToast('✅ Review submitted!');
                    render('product', { id: productId });
                }
            };

            window.submitContact = async function() {
                const name = document.getElementById('contactName').value.trim();
                const email = document.getElementById('contactEmail').value.trim();
                const message = document.getElementById('contactMsg').value.trim();
                if (!name || !email || !message) { showToast('Please fill all fields.'); return; }
                const res = await apiCall('contact', 'POST', { name, email, message });
                if (res.success) {
                    showToast('✅ Message sent! We\'ll get back to you soon.');
                    render('contact');
                }
            };

            window.updateOrderStatus = async function(orderId, status) {
                if (!isAdmin()) { showToast('Unauthorized'); return; }
                const res = await apiCall('orders/' + orderId, 'PUT', { status });
                if (res.success) render('admin');
            };

            window.restoreStock = async function(productId) {
                if (!isAdmin()) { showToast('Unauthorized'); return; }
                const qty = prompt('Enter quantity to restore:', '5');
                if (qty === null) return;
                const res = await apiCall('admin/restore', 'POST', { product_id: productId, quantity: parseInt(qty) || 1 });
                if (res.success) {
                    showToast('✅ Stock restored!');
                    render('admin');
                }
            };

            window.deleteProduct = async function(productId) {
                if (!confirm('Delete this product?')) return;
                const res = await apiCall('products/' + productId, 'DELETE');
                if (res.success) {
                    showToast('✅ Product deleted');
                    render('admin');
                }
            };

            window.addProductForm = function() {
                const name = prompt('Product name:');
                if (!name) return;
                const price = parseFloat(prompt('Price:'));
                if (isNaN(price)) return;
                const stock = parseInt(prompt('Stock:')) || 0;
                const category_id = parseInt(prompt('Category ID (1-6):')) || 1;
                const p = {
                    name,
                    price,
                    stock,
                    category_id,
                    description: prompt('Description:') || 'Premium tech product.',
                    discount: parseInt(prompt('Discount %:')) || 0,
                    featured: confirm('Featured?'),
                    bestseller: confirm('Bestseller?'),
                    rating: 0,
                    reviews_count: 0
                };
                apiCall('products', 'POST', p).then(() => {
                    showToast('✅ Product added!');
                    render('admin');
                });
            };

            window.editProduct = async function(productId) {
                const p = findProduct(productId);
                if (!p) return;
                const newPrice = prompt('New price:', p.price);
                if (newPrice === null) return;
                const newStock = prompt('New stock:', p.stock);
                if (newStock === null) return;
                const updates = {
                    price: parseFloat(newPrice) || p.price,
                    stock: parseInt(newStock) || p.stock
                };
                await apiCall('products/' + productId, 'PUT', updates);
                showToast('✅ Product updated!');
                render('admin');
            };

            // ---- Toast Notification ----
            function showToast(message) {
                const existing = document.querySelector('.toast-notification');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast-notification';
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = '0.4s';
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }

            // ---- UI Helpers ----
            function updateNav() {
                const loginBtn = document.getElementById('loginBtn');
                const registerBtn = document.getElementById('registerBtn');
                const logoutBtn = document.getElementById('logoutBtn');
                const userBadge = document.getElementById('userBadge');
                if (currentUser) {
                    loginBtn.style.display = 'none';
                    registerBtn.style.display = 'none';
                    logoutBtn.style.display = 'inline';
                    userBadge.style.display = 'inline';
                    userBadge.textContent = '👤 ' + currentUser.name;
                    const navLinks = document.getElementById('navLinks');
                    let adminLink = navLinks.querySelector('[data-page="admin"]');
                    if (isAdmin() && !adminLink) {
                        const a = document.createElement('a');
                        a.dataset.page = 'admin';
                        a.textContent = '⚙️ Admin';
                        a.onclick = (e) => { e.preventDefault();
                            navigate('admin'); };
                        navLinks.appendChild(a);
                    }
                    if (!isAdmin() && adminLink) adminLink.remove();
                } else {
                    loginBtn.style.display = 'inline';
                    registerBtn.style.display = 'inline';
                    logoutBtn.style.display = 'none';
                    userBadge.style.display = 'none';
                }
            }

            function updateCartBadge() {
                const badge = document.getElementById('cartCount');
                if (currentUser) {
                    const cart = getCart(currentUser.id);
                    const items = getCartItems(cart.id);
                    const count = items.reduce((s, i) => s + i.quantity, 0);
                    badge.textContent = count;
                } else {
                    badge.textContent = '0';
                }
            }

            // ---- Event Listeners ----
            document.addEventListener('click', function(e) {
                const link = e.target.closest('[data-page]');
                if (link) {
                    e.preventDefault();
                    const page = link.dataset.page;
                    const params = link.dataset.params ? JSON.parse(link.dataset.params) : undefined;
                    if (page === 'logout') return;
                    if (page === 'admin' && !isAdmin()) {
                        showToast('⛔ Admin access required.');
                        return;
                    }
                    navigate(page, params);
                }

                    apiCall('auth/logout', 'POST').then(() => {
                        currentUser = null;
                        updateNav();
                        render('home');
                        showToast('👋 Logged out');
                    });
                }
                if (e.target.id === 'shopFilterBtn') {
                    const search = document.getElementById('shopSearch').value;
                    const category = document.getElementById('shopCategory').value;
                    const sort = document.getElementById('shopSort').value;
                    navigate('shop', { search, category, sort });

                document.getElementById('chatWindow').classList.toggle('open');
            });

                const input = document.getElementById('chatInput');
                const msg = input.value.trim();
                if (!msg) return;
                const messages = document.getElementById('chatMessages');
                messages.innerHTML += `<div class="msg user">${msg}</div>`;
                input.value = '';
                const res = await apiCall('chatbot', 'POST', { message: msg });
                const reply = res.reply || 'Sorry, I didn\'t understand that.';
                messages.innerHTML += `<div class="msg bot">${reply}</div>`;
                messages.scrollTop = messages.scrollHeight;
            });

                if (e.key === 'Enter') document.getElementById('chatSend').click();

            function router() {
                const hash = window.location.hash.slice(1);

                    render(page, params);
